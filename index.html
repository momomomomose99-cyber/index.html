<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Zombie Survival Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 120px; height: 120px; background: red; border-radius: 50%; color: white; text-align: center; line-height: 120px; z-index: 10; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="fireBtn">FIRE</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة مكثفة
        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(0, 10, 0);
        scene.add(dirLight);

        let zombieTemplate = null;
        const loader = new THREE.GLTFLoader();
        
        loader.load('zombie.glb', (gltf) => {
            zombieTemplate = gltf.scene;
            // تكبير الموديل في حال كان صغيراً جداً
            zombieTemplate.scale.set(5, 5, 5); 
        });

        let entities = [];
        function spawn() {
            let obj;
            if(zombieTemplate) {
                obj = zombieTemplate.clone();
            } else {
                // شكل احتياطي في حال تأخر الموديل
                obj = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshBasicMaterial({color: 0x00ff00}));
            }
            obj.position.set((Math.random()-0.5)*10, 0, -20);
            scene.add(obj);
            entities.push(obj);
        }
        setInterval(spawn, 2000);

        document.getElementById('fireBtn').onclick = () => {
            if(entities.length > 0) {
                scene.remove(entities[0]);
                entities.shift();
            }
        };

        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            entities.forEach(e => e.position.z += 0.1);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
