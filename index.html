<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix System</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: black; }
        canvas { display: block; }
        /* شاشة البداية السوداء */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; display: flex; align-items: center; justify-content: center; 
            z-index: 20; cursor: pointer; 
        }
        button { 
            padding: 20px 50px; background: transparent; border: 3px solid #0F0; 
            color: #0F0; font-size: 30px; font-weight: bold; font-family: monospace; 
            border-radius: 10px; transition: 0.3s;
        }
        button:hover { background: #0F0; color: black; }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="startBtn">PRESS</button>
    </div>

    <canvas id="matrix"></canvas>
    
    <audio id="bgMusic" loop>
        <source src="Song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('start-screen');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        // الأرقام مرتبة
        const fontSize = 20;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                // رسم أرقام (0 أو 1) بدلاً من الخطوط
                const text = Math.random() > 0.5 ? "1" : "0";
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.99) drops[i] = 0;
                drops[i]++;
            }
        }

        // تشغيل البداية
        startBtn.addEventListener('click', () => {
            music.play();
            startScreen.style.display = 'none'; // إخفاء الشاشة السوداء
            setInterval(draw, 100); // بدء حركة الماتريكس
        });
    </script>
</body>
</html>
