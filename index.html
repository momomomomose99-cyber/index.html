<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival Live</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; z-index: 10; }
        #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; background: red; border-radius: 50%; color: white; text-align: center; line-height: 100px; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">القتلى: <span id="killCount">0</span></div>
    <div id="fireBtn">FIRE</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إنشاء شكل "زومبي" بسيط من الكود (مكعب أخضر) لضمان الحركة
        function createZombie() {
            const geo = new THREE.BoxGeometry(1, 2, 1);
            const mat = new THREE.MeshBasicMaterial({color: 0x00ff00});
            const zombie = new THREE.Mesh(geo, mat);
            zombie.position.set((Math.random()-0.5)*10, 0, -20);
            scene.add(zombie);
            return zombie;
        }

        let zombies = [];
        for(let i=0; i<5; i++) zombies.push(createZombie());

        // تحكم بسيط
        document.getElementById('fireBtn').onclick = () => {
            if(zombies.length > 0) {
                scene.remove(zombies[0]);
                zombies.shift();
                document.getElementById('killCount').innerText = parseInt(document.getElementById('killCount').innerText) + 1;
            }
        };

        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            zombies.forEach(z => z.position.z += 0.05); // الزومبي يتحركون
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
