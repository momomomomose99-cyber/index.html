<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Warfare - Final Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 120px; height: 120px; background: red; border-radius: 50%; color: white; text-align: center; line-height: 120px; z-index: 10; font-weight: bold; font-size: 20px; border: 4px solid #fff; }
        #stats { position: absolute; top: 20px; left: 20px; color: white; font-size: 25px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="stats">القتلى: 0</div>
    <div id="fireBtn">FIRE</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة قوية جداً لرؤية الموديل
        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        let zombies = [];
        let score = 0;

        const loader = new THREE.GLTFLoader();
        // تحميل الموديل - إذا لم يظهر، المشكلة في الملف نفسه
        loader.load('zombie.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(2, 2, 2); // تكبير الموديل
            
            setInterval(() => {
                const z = model.clone();
                z.position.set((Math.random()-0.5)*10, 0, -20);
                scene.add(z);
                zombies.push(z);
            }, 2000);
        }, undefined, (err) => {
            alert("خطأ: لا يمكن تحميل الملف zombie.glb! تأكد من رفعه بشكل صحيح.");
        });

        document.getElementById('fireBtn').onclick = () => {
            if(zombies.length > 0) {
                scene.remove(zombies[0]);
                zombies.shift();
                score++;
                document.getElementById('stats').innerText = "القتلى: " + score;
            }
        };

        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            zombies.forEach(z => z.position.z += 0.1);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
