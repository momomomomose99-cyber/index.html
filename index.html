<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival PRO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #stats { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-family: sans-serif; }
        #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 120px; height: 120px; background: red; border-radius: 50%; border: 4px solid white; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="stats">القتلى: 0</div>
    <div id="fireBtn">FIRE</div>

    <script>
        // إعداد المحرك
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة بسيطة
        scene.add(new THREE.AmbientLight(0xffffff, 1));

        let score = 0;
        let zombies = [];

        // إنشاء "زومبي" هندسي (مكعبات ملونة)
        function spawnZombie() {
            const geo = new THREE.BoxGeometry(1, 1.5, 1);
            const mat = new THREE.MeshLambertMaterial({color: 0x00aa00});
            const zombie = new THREE.Mesh(geo, mat);
            zombie.position.set((Math.random()-0.5)*10, 0, -20);
            scene.add(zombie);
            zombies.push(zombie);
        }

        // رسبنة مستمرة
        setInterval(spawnZombie, 1500);

        // التحكم
        document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(zombies.length > 0) {
                scene.remove(zombies[0]);
                zombies.shift();
                score++;
                document.getElementById('stats').innerText = "القتلى: " + score;
            }
        });

        // الحلقة الرئيسية
        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            zombies.forEach(z => {
                z.position.z += 0.15; // سرعة الزومبي
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
