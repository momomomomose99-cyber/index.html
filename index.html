<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: black; }
        canvas { display: block; }
        #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #0F0; font-family: 'Courier New', monospace; z-index: 10; }
        button { padding: 15px 30px; cursor: pointer; background: transparent; border: 2px solid #0F0; color: #0F0; font-size: 20px; font-weight: bold; border-radius: 10px; transition: 0.3s; }
        button:hover { background: #0F0; color: black; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div id="overlay">
        <h1>البيانات الرقمية</h1>
        <button id="playBtn">بدء التجربة</button>
    </div>
    
    <!-- ربط ملف الموسيقى (تأكد من وجود الملف بنفس الاسم) -->
    <audio id="bgMusic" loop>
        <source src="Song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = "01";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // تشغيل الموسيقى عند الضغط
        playBtn.addEventListener('click', () => {
            music.play();
            playBtn.style.display = 'none';
        });
    </script>
</body>
</html>
