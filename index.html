<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Zombie Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #stats { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; }
        #fireBtn { position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; background: red; border-radius: 50%; color: white; text-align: center; line-height: 100px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="stats">القتلى: 0</div>
    <div id="fireBtn">FIRE</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let zombieTemplate = null;
        let score = 0;
        let zombies = [];

        // تحسين تحميل الموديل
        const loader = new THREE.GLTFLoader();
        loader.load('zombie.glb', (gltf) => {
            zombieTemplate = gltf.scene;
        }, undefined, (error) => console.error("Error loading model:", error));

        function spawn() {
            if(!zombieTemplate) return; // لا ترسم شيئاً حتى يتحمل الموديل
            const z = zombieTemplate.clone();
            z.position.set((Math.random()-0.5)*10, 0, -20);
            scene.add(z);
            zombies.push(z);
        }
        setInterval(spawn, 3000);

        document.getElementById('fireBtn').onclick = () => {
            if(zombies.length > 0) {
                scene.remove(zombies[0]);
                zombies.shift();
                score++;
                document.getElementById('stats').innerText = "القتلى: " + score;
            }
        };

        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            zombies.forEach(z => z.position.z += 0.05);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
