<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
        }
        .button {
            background-color: red;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
        .info {
            color: blue;
            font-size: 20px;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            background-color: #f3f3f3;
            overflow: hidden;
        }
        .progress-bar div {
            height: 20px;
            background-color: green;
            width: 0;
        }
    </style>
</head>
<body>
    <h1>تطبيق ربح للطرفين</h1>
    <div class="button" onclick="showSubscriptionInfo()">ادخل بطاقتك البنكية</div>
    <div id="subscriptionInfo" style="display:none;">
        <div class="info">
            <h2>معلومات الاشتراك</h2>
            <p>المستوى 1: 10,000 دينار عراقي - 20 اعلان</p>
            <p>المستوى 2: 15,000 دينار عراقي - 25 اعلان</p>
            <p>المستوى 3: 20,000 دينار عراقي - 30 اعلان</p>
        </div>
        <div class="progress-bar">
            <div id="progressBar"></div>
        </div>
    </div>
    <script>
        function showSubscriptionInfo() {
            document.getElementById('subscriptionInfo').style.display = 'block';
        }
        function updateProgressBar(amount, level) {
            const progressBar = document.getElementById('progressBar');
            let width = 0;
            if (level === 1) {
                width = (amount * 100) / 10000;
            } else if (level === 2) {
                width = (amount * 100) / 15000;
            } else if (level === 3) {
                width = (amount * 100) / 20000;
            }
            progressBar.style.width = width + '%';
        }
    </script>
</body>
</html>
