<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix System - Continuous</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: black; }
        canvas { display: block; }
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; display: flex; align-items: center; justify-content: center; 
            z-index: 20; cursor: pointer; 
        }
        button { 
            padding: 20px 50px; background: transparent; border: 3px solid #0F0; 
            color: #0F0; font-size: 30px; font-weight: bold; font-family: monospace; 
            border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="startBtn">START MATRIX</button>
    </div>

    <canvas id="matrix"></canvas>
    
    <audio id="bgMusic" loop>
        <source src="Song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('start-screen');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        // مصفوفة لتخزين مواقع الـ Y لكل عمود
        let drops = Array(columns).fill(1);

        function draw() {
            // نضع خلفية سوداء شفافة جداً لخلق أثر التلاشي
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                // اختيار رقم عشوائي
                const text = Math.floor(Math.random() * 2).toString();
                
                // رسم الرقم
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // إعادة تعيين العمود عشوائياً عند وصوله لأسفل الشاشة
                // هذا يجعل الأرقام "لازقة" ببعضها ومستمرة بدون انتظار
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // زيادة الموقع للعمود
                drops[i]++;
            }
        }

        startBtn.addEventListener('click', () => {
            music.play();
            startScreen.style.display = 'none';
            // سرعة التحديث 30 ميللي ثانية لتعطي تدفقاً أنعم
            setInterval(draw, 30); 
        });
    </script>
</body>
</html>
