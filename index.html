<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival Final Build</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #controls { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: space-between; padding: 0 50px; box-sizing: border-box; }
        .btn { pointer-events: auto; width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: bold; }
        #fire-btn { background: #ff0000; }
        #move-btn { background: rgba(255,255,255,0.3); }
        #stats { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="game-canvas"></div>
    <div id="ui-overlay">
        <div id="stats">القتلى: <span id="score">0</span> | الحيوية: <span id="hearts">❤❤❤</span></div>
        <div id="controls">
            <div id="move-btn" class="btn">MOVE</div>
            <div id="fire-btn" class="btn">FIRE</div>
        </div>
    </div>

    <script>
        // إعداد المحرك الأساسي
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        // إضافة إضاءة أقوى
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 10, 5);
        scene.add(light);

        // تحميل الموديل باستخدام نظام LoadingManager لتجنب الأخطاء
        const manager = new THREE.LoadingManager();
        const loader = new THREE.GLTFLoader(manager);
        let zombieTemplate = null;

        loader.load('zombie.glb', (gltf) => {
            zombieTemplate = gltf.scene;
            console.log("تم تحميل الموديل بنجاح");
        }, undefined, (err) => {
            alert("خطأ في تحميل الموديل، تأكد من وجود ملف zombie.glb في نفس مجلد الموقع");
        });

        // مصفوفة لإدارة الزومبي
        let zombies = [];
        function spawn() {
            if(zombieTemplate) {
                let z = zombieTemplate.clone();
                z.position.set((Math.random()-0.5)*20, 0, -30);
                scene.add(z);
                zombies.push(z);
            }
        }
        setInterval(spawn, 3000);

        // التحكم
        document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(zombies.length > 0) {
                scene.remove(zombies[0]);
                zombies.shift();
                document.getElementById('score').innerText = parseInt(document.getElementById('score').innerText) + 1;
            }
        });

        // حلقة اللعبة
        camera.position.z = 5;
        function update() {
            requestAnimationFrame(update);
            zombies.forEach(z => z.position.z += 0.1);
            renderer.render(scene, camera);
        }
        update();
    </script>
</body>
</html>
