    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bgMusic');
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('start-screen');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const fontSize = 20;
        const columns = Math.floor(canvas.width / fontSize);
        // نبدأ من الصفر للجميع ليتحركوا ككتلة واحدة
        let pos = Array(columns).fill(0);

        function draw() {
            // نغطي الشاشة بخلفية شبه شفافة ليعطي تأثير الحركة
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            let allFinished = true;
            for (let i = 0; i < columns; i++) {
                // نرسم الرقم
                const text = Math.random() > 0.5 ? "1" : "0";
                ctx.fillText(text, i * fontSize, pos[i] * fontSize);
                
                // تحريك العمود للأسفل
                if (pos[i] * fontSize < canvas.height) {
                    pos[i]++;
                    allFinished = false;
                }
            }

            // إذا وصلت كل الأرقام للأسفل، نبدأ "جولة" جديدة من الأعلى
            if (allFinished) {
                pos.fill(0);
            }
        }

        startBtn.addEventListener('click', () => {
            music.play();
            startScreen.style.display = 'none';
            // سرعة الجولة
            setInterval(draw, 50); 
        });
    </script>
